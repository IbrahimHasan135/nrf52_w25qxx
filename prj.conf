CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
# The chip on this module answers JEDEC 1C 30 17 (eON EN25Q64) and does not
# implement SFDP, so runtime SFDP discovery fails at init. The minimal driver
# uses the devicetree values (jedec-id, size) directly instead.
CONFIG_SPI_NOR_SFDP_MINIMAL=y

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=2048

# Surface driver init errors (spi_nor: SFDP read failed / etc.) on the console.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Buffer log lines until the USB CDC client attaches, so early boot errors show.
CONFIG_LOG_MODE_DEFERRED=y

# Console is the XIAO's USB CDC ACM (board includes cdc_acm_serial.dtsi).
# NCS/Zephyr enable the new USB device stack (USB_DEVICE_STACK_NEXT) with the
# CDC ACM class automatically; do NOT enable the legacy CONFIG_USB_DEVICE_STACK
# here — both CDC ACM drivers then link and fail with a multiple definition.

CONFIG_GPIO=y
